name: CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3-reportlab fonts-dejavu-core poppler-utils unzip
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:migrations
      - run: npm test
      - name: Backup and restore portability exercise
        run: npm run verify:backup-restore
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E — mobile and desktop
        run: npm run test:browser
      - name: Build production container
        run: docker build -t job-mvp:${{ github.sha }} .
      - name: Production container smoke test
        run: |
          docker run -d --name job-mvp -p 3000:3000 -e APP_ORIGIN=http://127.0.0.1:3000 job-mvp:${{ github.sha }}
          trap 'docker rm -f job-mvp >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs job-mvp
          exit 1
